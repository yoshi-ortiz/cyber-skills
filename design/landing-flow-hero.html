<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyber Skills — A rail your agent can't fall off</title>
  <style>
    :root {
      --paper: #ffffff;
      --ink: #171a1f;
      --muted: #555d67;
      --line: #171a1f;
      --cyan: #13c8db;
      --pink: #f33da2;
      --blue: #2574e8;
      --green: #2cc978;
      --orange: #ff8b2c;
      --yellow: #ffd51f;
      --shadow: 5px 5px 0 var(--line);
    }

    * { box-sizing: border-box; }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; }

    .site-shell {
      width: min(1440px, 100%);
      margin-inline: auto;
      padding: 0 clamp(20px, 4vw, 64px) clamp(36px, 5vw, 72px);
      overflow: hidden;
    }

    .site-nav {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 2px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font: 900 15px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      aspect-ratio: 1;
      background: var(--yellow);
      border: 2px solid var(--line);
      border-radius: 10px;
      box-shadow: 3px 3px 0 var(--line);
      font-size: 19px;
      letter-spacing: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(16px, 2.4vw, 34px);
      font-size: 14px;
      font-weight: 750;
    }

    .nav-links a { text-decoration: none; }

    .hero {
      padding-top: clamp(40px, 4.5vw, 60px);
    }

    .hero-intro {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr);
      /* `end` bottom-aligned two columns of unequal height, so the shorter one
         hung from the taller one's baseline and left its dead space ABOVE the
         headline -- a hole between the nav rule and the first word, which reads
         as a mistake rather than as air. Worst at 780-900px, where the right
         column grows a fourth line and the two buttons stop fitting side by
         side, which is exactly the width the ranking thumbnail renders at. */
      align-items: start;
      gap: clamp(28px, 6vw, 88px);
      margin-bottom: clamp(20px, 2vw, 30px);
    }

    .eyebrow {
      margin: 0 0 15px;
      font: 800 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 820px;
      margin: 0;
      font-family: "Arial Rounded MT Bold", "Trebuchet MS", ui-sans-serif, sans-serif;
      font-size: clamp(48px, 6.7vw, 102px);
      line-height: 1.02;
      letter-spacing: -.055em;
    }

    .hero-copy {
      align-self: end;
      min-width: 0;
      padding-bottom: .25rem;
    }

    .hero-copy p {
      max-width: 56ch;
      margin: 0 0 24px;
      color: var(--muted);
      font-size: clamp(16px, 1.4vw, 19px);
      line-height: 1.55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border: 2px solid var(--line);
      border-radius: 11px;
      font-weight: 850;
      text-decoration: none;
    }

    .button-primary {
      background: var(--yellow);
      box-shadow: var(--shadow);
    }

    .button-secondary { background: var(--paper); }

    .button:focus-visible {
      outline: 4px solid var(--blue);
      outline-offset: 3px;
    }

    .flow-figure {
      min-width: 0;
      margin: 0;
    }

    /* The rail map is a CSS layout, not a flat picture. Every station is a
       real element positioned in percentages of the 1600x900 design frame, so
       it stays editable, translatable, and legible to a screen reader. The
       road is CSS too, so nothing here depends on an external file that a
       different serving directory could break. `cqw` units let the whole
       scene scale as one drawing. */
    .flow-map {
      position: relative;
      container-type: inline-size;
      width: min(100%, 1080px);
      min-width: 720px;
      aspect-ratio: 1600 / 1000;
      margin-inline: auto;
      background: #faf5ee;
      border: 2px solid var(--line);
      border-radius: 14px;
      /* Not overflow:hidden: the near-edge station billboards (st-land,
         st-check) sit close enough to the card boundary that clipping here
         cut their text mid-word ("/land DEPL…"). The rail shapes are already
         computed to stay inside 0-100%, so nothing else relies on this. */
      overflow: visible;
    }

    /* Group 47's topology: a central X carrying the forward diagonals, plus a
       return arc down each outer side. Bars are rotated rectangles; arcs are
       rings clipped to one half. Both are ordinary boxes, so the road
       recolours, rescales and reflows with the rest of the page. */
    .rail-bar,
    .rail-arc {
      position: absolute;
      background: var(--yellow);
    }

    .rail-bar {
      left: 50%;
      top: 48.06%;
      width: 46.2%;
      height: 2.75cqw;
      translate: -50% -50%;
      border-top: .25cqw solid var(--line);
      border-bottom: .25cqw solid var(--line);
    }

    .rail-bar-a { rotate:  30deg; }
    .rail-bar-b { rotate: -30deg; }

    .rail-arc {
      top: 26.01%;
      width: 25.5%;
      height: 44.01%;
      background: none;
      border: 2.75cqw solid var(--yellow);
      border-radius: 50%;
      box-shadow: 0 0 0 .25cqw var(--line), inset 0 0 0 .25cqw var(--line);
    }

    .rail-arc-left  { left: 6.25%;  clip-path: inset(-2cqw 50% -2cqw -2cqw); }
    .rail-arc-right { left: 68.25%; clip-path: inset(-2cqw -2cqw -2cqw 50%); }

    /* Painted centre line, drawn on top of the band. */
    .rail-bar::after {
      content: "";
      position: absolute;
      inset-block: calc(50% - .12cqw);
      inset-inline: 0;
      border-top: .25cqw dashed #fff;
    }

    .rail-arc::after {
      content: "";
      position: absolute;
      inset: -1.5cqw;
      border: .25cqw dashed #fff;
      border-radius: 50%;
    }

    .station {
      position: absolute;
      translate: -50% -50%;
      display: grid;
      justify-items: center;
      gap: 0;
    }

    /* A square rotated 45deg then flattened is the isometric plate. The
       drop-shadow sits on the untransformed wrapper so the extrusion reads as
       depth rather than a rotated blur. */
    .plate-wrap { filter: drop-shadow(0 1.15cqw 0 var(--plate-edge)); }

    .plate {
      width: var(--plate-side);
      aspect-ratio: 1;
      background: var(--plate-face);
      border: 2px solid var(--line);
      transform: scale(1, var(--plate-squash)) rotate(45deg);
    }

    .station-solid {
      --plate-side: 22.1cqw;
      --plate-squash: .38;
    }

    .station-ghost {
      --plate-side: 8.4cqw;
      --plate-squash: .505;
    }

    /* A sims-style cutaway room: floor diamond plus two back walls rising
       from its north-west and north-east edges, meeting at the room's back
       corner. Every point is a formula on (half-width, half-height, wall
       height) -- 80/45/46 in a 200x170 frame -- not a hand-drawn path, so a
       different room is the same three polygons with new fill colors. Wall
       height is squat by design (cartoon-round direction): a tall wall reads
       as a cubic box, so it stays under the floor's own half-height. The
       two walls are shaded relative to --plate-face with color-mix, the way
       a lit isometric cube always reads left wall darkest, right wall
       mid-tone, floor brightest. Round joins on every outline soften the
       silhouette instead of the sharp miters a literal cube would have. */
    .room-box {
      width: 26cqw;
      overflow: visible;
      filter: drop-shadow(0 1.1cqw 0 rgba(23, 26, 31, .22));
    }

    .room-floor {
      fill: var(--plate-face);
      stroke: var(--line);
      stroke-width: 3;
      stroke-linejoin: round;
    }

    .room-wall-left {
      fill: color-mix(in srgb, var(--plate-face) 58%, #171a1f);
      stroke: var(--line);
      stroke-width: 3;
      stroke-linejoin: round;
    }

    .room-wall-right {
      fill: color-mix(in srgb, var(--plate-face) 78%, #171a1f);
      stroke: var(--line);
      stroke-width: 3;
      stroke-linejoin: round;
    }

    /* The room boss and its signature item, drawn as CSS primitives layered
       over the room-box SVG rather than as hand-authored <svg> coordinates
       (see asset-sourcing.md: HTML/CSS geometric primitives are the visible
       system itself, an opaque SVG path is not). Every shape is a circle or
       a heavily-rounded rect, positioned as a percentage of the same 200x170
       frame the room-box polygons already use, so a different boss is the
       same formula with new fill colors -- exactly like the walls above it.
       `.room-stage` sizes the frame; the SVG and the two overlays share it. */
    .room-stage { position: relative; width: 26cqw; aspect-ratio: 200 / 170; }
    .room-stage > .room-box { position: absolute; inset: 0; width: 100%; }
    .room-figure, .room-item-css {
      position: absolute; inset: 0; filter: drop-shadow(0 .3cqw 0 rgba(23, 26, 31, .18));
    }
    .room-figure > div, .room-item-css > div {
      position: absolute; border: .22cqw solid var(--line);
    }
    .rf-head, .rf-hair, .ri-round { border-radius: 50%; }
    .rf-body, .ri-pill { border-radius: 999px; }
    .rf-hair { border-bottom: none; border-radius: 60% 60% 15% 15%; }

    .billboard {
      position: absolute;
      z-index: 2;
      padding: .5cqw .9cqw;
      background: var(--paper);
      border: 2px solid var(--line);
      border-radius: .55cqw;
      box-shadow: .25cqw .25cqw 0 var(--line);
      font: 800 1.55cqw/1.1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: nowrap;
    }

    /* Solid stations hang their sign on two posts. The upper pair points its
       sign up; the lower pair points down, which keeps both clear of the
       ghost stations parked at mid-height between them. */
    .station-solid .billboard::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: 22%;
      width: 56%;
      height: 3.4cqw;
      border-left: .5cqw solid var(--line);
      border-right: .5cqw solid var(--line);
    }

    .st-first .billboard,
    .st-land .billboard { bottom: calc(100% - 1cqw); }

    .st-first .billboard::after,
    .st-land .billboard::after { top: 100%; }

    .st-build .billboard,
    .st-check .billboard { top: calc(100% - 1cqw); }

    .st-build .billboard::after,
    .st-check .billboard::after { bottom: 100%; }

    /* Ghost stations are off the loop, so their label sits on the plate. */
    .station-ghost .billboard {
      position: static;
      margin-bottom: -1.6cqw;
      font-size: 1.25cqw;
      box-shadow: none;
      background: transparent;
      border: 0;
    }

    .st-first { left: 21.5%; top: 26.01%; --plate-face: var(--cyan);  --plate-edge: #0b7f8c; }
    .st-land  { left: 78.5%; top: 26.01%; --plate-face: var(--blue);  --plate-edge: #12459a; }
    .st-build { left: 21.5%; top: 70.02%; --plate-face: var(--pink);  --plate-edge: #a31666; }
    .st-check { left: 78.5%; top: 70.02%; --plate-face: var(--green); --plate-edge: #17804a; }
    .st-kit   { left: 28.1%; top: 47.97%; --plate-face: #fff3e9; --plate-edge: #cbb6a6; }
    .st-fix   { left: 71.9%; top: 47.97%; --plate-face: #eef3f8; --plate-edge: #adb9c4; }

    .flow-scroll {
      max-width: 100%;
      min-width: 0;
      margin-inline: clamp(-20px, -2vw, 0px);
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scrollbar-color: var(--yellow) transparent;
    }

    .flow-caption {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin-top: -4px;
      padding-top: 16px;
      border-top: 2px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .flow-caption strong { color: var(--ink); }

    /* 780, not 900. The stacked treatment used to start at 900px, but the two
       hero columns are fluid -- minmax(0, 1.35fr) and a 300px floor -- and they
       still fit at 780px (371px + 300px inside 718px of content). Everything
       between 780 and 900 was being stacked while it had room not to be.

       That range is not hypothetical: the ranking companion lays a comp out in
       a fixed 850px frame and the review render uses 510px, so at 900 EVERY
       preview of this page showed the tablet layout -- stacked hero, captions
       in a column under a full-width rule -- and the comp's own height ran to
       1272px inside an 1100px frame, clipping the last 172px. The design being
       ranked was never the design. At 780 the 850px frame renders the desktop
       layout it was drawn for, and the page measures 913px, inside the frame.

       Real 800-900px tablets get the same benefit; nothing here is tuned for
       the screenshot that is not also true for a reader at that width. */
    @media (max-width: 780px) {
      .hero-intro {
        width: 100%;
        min-width: 0;
        grid-template-columns: minmax(0, 1fr);
      }
      .hero-intro > *,
      .hero-copy,
      .hero-copy p {
        width: 100%;
        min-width: 0;
        max-width: 100%;
      }
      .flow-scroll { margin-inline: -20px; padding-inline: 20px; }
      .flow-caption { flex-direction: column; }
    }

    @media (max-width: 620px) {
      .site-nav { min-height: 68px; }
      .nav-links a:not(:last-child) { display: none; }
      h1 { font-size: clamp(52px, 16vw, 74px); }
      .hero { padding-top: 38px; }
      .hero-intro,
      .hero-copy,
      .hero-copy p,
      .actions {
        width: calc(100vw - 40px);
        max-width: calc(100vw - 40px);
      }
      .flow-map { min-width: 680px; }
      .actions { flex-direction: column; }
      .button { width: 100%; }
      .flow-scroll::after {
        content: "Swipe to follow the rail →";
        position: sticky;
        left: 20px;
        display: inline-block;
        margin-bottom: 10px;
        padding: 7px 10px;
        background: var(--paper);
        border: 2px solid var(--line);
        border-radius: 8px;
        font-size: 12px;
        font-weight: 800;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
