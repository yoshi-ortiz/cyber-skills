<!doctype html>
<meta charset="utf-8">
<title>Context token vectors</title>
<style>
  :root {
    --bg:#fbfbfa; --fg:#1a1a19; --dim:#6b6b68; --line:#e4e4e1;
    --card:#fff; --local:#4338ca; --noise:#b45309; --accent:#0f766e;
  }
  @media (prefers-color-scheme:dark) {
    :root { --bg:#131312; --fg:#e8e8e5; --dim:#96968f; --line:#2c2c29;
            --card:#1c1c1a; --local:#a5b4fc; --noise:#fbbf24; --accent:#5eead4; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:2rem 1.25rem 4rem; background:var(--bg); color:var(--fg);
    font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:1080px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 .25rem; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:.9rem; margin:0 0 1.5rem; }
  .stats { display:flex; flex-wrap:wrap; gap:.5rem; margin:0 0 1.5rem; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:.5rem;
    padding:.6rem .9rem; min-width:7rem; }
  .stat b { display:block; font-size:1.35rem; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--dim); font-size:.75rem; text-transform:uppercase;
    letter-spacing:.05em; }
  figure { margin:0 0 1.75rem; background:var(--card); border:1px solid var(--line);
    border-radius:.5rem; padding:1rem; }
  figcaption { color:var(--dim); font-size:.8rem; margin-top:.6rem; }
  svg { width:100%; height:auto; display:block; }
  circle { cursor:pointer; }
  h2 { font-size:1rem; margin:2rem 0 .75rem; }
  table { width:100%; border-collapse:collapse; font-size:.875rem; }
  th { text-align:left; color:var(--dim); font-weight:600; font-size:.7rem;
    text-transform:uppercase; letter-spacing:.05em; padding:.4rem .5rem;
    border-bottom:1px solid var(--line); }
  td { padding:.4rem .5rem; border-bottom:1px solid var(--line);
    vertical-align:top; }
  .scroll { overflow-x:auto; }
  code { font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .local { color:var(--local); font-weight:600; }
  .tag { display:inline-block; padding:.05rem .4rem; border-radius:.25rem;
    font-size:.72rem; background:var(--line); }
  .tag.noise { background:transparent; color:var(--noise);
    border:1px solid var(--noise); }
  .num { font-variant-numeric:tabular-nums; text-align:right; }
  .peers { color:var(--dim); }
  .peers b { color:var(--fg); font-weight:600; }
  .note { color:var(--dim); font-size:.85rem; border-left:2px solid var(--line);
    padding-left:.9rem; margin:1.5rem 0 0; }
</style>
<div class="wrap">
  <h1>Context token vectors</h1>
  <p class="sub" id="sub"></p>
  <div class="stats" id="stats"></div>

  <figure>
    <svg id="plot" viewBox="0 0 800 420" role="img" aria-label="Skill embedding scatter"></svg>
    <figcaption>
      Two principal components of the embedding space. The clustering happened in
      full dimensionality, so adjacency here is a reading aid and not the result.
      Filled marks are local skills. Hover for the name.
    </figcaption>
  </figure>

  <h2>Local skills, and who they actually sit next to</h2>
  <div class="scroll"><table id="localTable"></table></div>

  <h2>Every cluster</h2>
  <div class="scroll"><table id="clusterTable"></table></div>

  <p class="note">
    This observes position and overlap. It never observes quality. A skill marked
    <span class="tag noise">noise</span> has no peer among the skills installed,
    which is novelty or dilution, and nothing here can tell you which.
  </p>
</div>
<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

$("sub").textContent =
  `${D.root} · ${D.model} · seed ${D.seed}`;

const locals = D.skills.filter(s => s.local);
$("stats").innerHTML = [
  ["skills", D.skills.length], ["clusters", D.clusters],
  ["noise", D.noise], ["local", locals.length],
  ["local in noise", locals.filter(s => s.cluster < 0).length],
].map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");

// Scatter. Colour by cluster, and let noise stay uncoloured rather than
// inventing a category for points the algorithm declined to place.
const W = 800, H = 420, P = 24;
const hue = c => c < 0 ? "var(--dim)" : `hsl(${(c * 47) % 360} 62% 52%)`;
$("plot").innerHTML = D.skills.map(s => {
  const x = P + s.x * (W - 2 * P), y = P + (1 - s.y) * (H - 2 * P);
  return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${s.local ? 7 : 3.5}"
    fill="${s.local ? "var(--local)" : hue(s.cluster)}"
    fill-opacity="${s.local ? .95 : .5}"
    stroke="${s.local ? "var(--bg)" : "none"}" stroke-width="1.5"
    ><title>${esc(s.name)} — ${s.cluster < 0 ? "noise" : "c" + s.cluster}</title></circle>`;
}).join("");

const tag = c => c < 0
  ? '<span class="tag noise">noise</span>'
  : `<span class="tag">c${c}</span>`;

$("localTable").innerHTML =
  "<tr><th>Skill</th><th>Cluster</th><th>Bytes</th><th>Nearest peers, by cosine similarity</th></tr>" +
  locals.map(s => `<tr>
    <td><code class="local">${esc(s.name)}</code></td>
    <td>${tag(s.cluster)}</td>
    <td class="num">${s.bytes.toLocaleString()}</td>
    <td class="peers">${s.peers.map(p =>
      `${p.sim.toFixed(3)} <b class="${p.local ? "local" : ""}">${esc(p.name)}</b>`
    ).join(" · ")}</td></tr>`).join("");

const byCluster = new Map();
for (const s of D.skills) {
  if (s.cluster < 0) continue;
  if (!byCluster.has(s.cluster)) byCluster.set(s.cluster, []);
  byCluster.get(s.cluster).push(s);
}
$("clusterTable").innerHTML =
  "<tr><th>Cluster</th><th>Size</th><th>Members</th></tr>" +
  [...byCluster.entries()].sort((a, b) => a[0] - b[0]).map(([c, members]) => `<tr>
    <td>${tag(c)}</td><td class="num">${members.length}</td>
    <td>${members.map(m =>
      `<code class="${m.local ? "local" : ""}">${esc(m.name)}</code>`).join(", ")}</td>
    </tr>`).join("");
</script>
