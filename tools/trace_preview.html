<!doctype html>
<meta charset="utf-8">
<title>Compiler trace</title>
<style>
  :root { --correction:#b91c1c; --criterion:#b45309; --evidence:#1d4ed8;
          --instruction:#6d28d9; --doctrine:#475569; }
  body { margin:0; padding:2rem; background:#fafaf9; color:#1c1917;
         font:14px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { max-width:70rem; margin:0 auto; }
  h1 { font-size:1.25rem; margin:0 0 .25rem; }
  .meta { color:#57534e; margin-bottom:1.5rem; }
  .bar { height:.5rem; background:#e7e5e4; border-radius:.25rem; overflow:hidden;
         margin:.5rem 0 1.5rem; }
  .bar span { display:block; height:100%; background:#1c1917; }
  fieldset { border:1px solid #d6d3d1; border-radius:.375rem; padding:.75rem 1rem;
             margin:0 0 1.5rem; }
  legend { padding:0 .375rem; color:#57534e; font-size:.8125rem; }
  input { font:inherit; padding:.25rem .5rem; border:1px solid #d6d3d1;
          border-radius:.25rem; width:18rem; }
  button { font:inherit; padding:.25rem .75rem; border:1px solid #1c1917;
           border-radius:.25rem; background:#1c1917; color:#fff; cursor:pointer; }
  button[disabled] { opacity:.5; cursor:progress; }
  #status { margin-left:.75rem; color:#57534e; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:.75rem; text-transform:uppercase;
       letter-spacing:.06em; color:#78716c; border-bottom:1px solid #d6d3d1;
       padding:.375rem .5rem; }
  td { padding:.375rem .5rem; border-bottom:1px solid #eeedec; vertical-align:top; }
  tr.omitted { color:#a8a29e; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .key { font-family:ui-monospace, monospace; font-size:.8125rem; cursor:pointer; }
  .key::before { content:"\25B8 "; color:#a8a29e; }
  tr.open .key::before { content:"\25BE "; }
  .tag { display:inline-block; padding:.0625rem .375rem; border-radius:.1875rem;
         font-size:.6875rem; color:#fff; }
  .delta { color:#78716c; font-size:.8125rem; }
  .tokens { padding:.75rem .5rem 1rem; }
  .tokens code { display:inline-block; padding:.0625rem .25rem; margin:.0625rem;
                 border-radius:.1875rem; font-size:.75rem; white-space:pre;
                 background:#f5f5f4; border-bottom:2px solid currentColor; }
  .note { color:#78716c; font-size:.8125rem; margin-top:1.5rem; }
  select { font:inherit; font-size:.75rem; padding:.0625rem .125rem; margin-right:.125rem;
           border:1px solid #d6d3d1; border-radius:.1875rem; background:#fff;
           color:#57534e; max-width:6.5rem; }
  select.set { border-color:#1c1917; color:#1c1917; }
  select:disabled { opacity:.4; }
  #offline { display:none; background:#fef2f2; border:1px solid #fecaca;
             color:#991b1b; padding:.5rem .75rem; border-radius:.375rem;
             margin-bottom:1rem; font-size:.8125rem; }
</style>
<main>
  <div id="offline"></div>
  <h1 id="head"></h1>
  <p class="meta" id="meta"></p>
  <div class="bar"><span id="fill"></span></div>

  <fieldset>
    <legend>Exact count, advisory</legend>
    <input id="tok" spellcheck="false">
    <button id="go">Count</button>
    <span id="status"></span>
  </fieldset>

  <table>
    <thead><tr>
      <th>Chunk</th><th>Priority</th><th>Role</th><th>Tier</th><th>Channel</th>
      <th class="num">Estimated</th><th class="num">Exact</th><th>Reason</th>
      <th>Review</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <p class="note" id="note"></p>
</main>
<script type="module">
const DATA = __DATA__;
const T = DATA.trace;
const $ = (id) => document.getElementById(id);

$("head").textContent = `${T.pass}: ${T.used} of ${T.budget} tokens`;
$("meta").textContent =
  `profile ${T.profile.name}, ${T.profile.exact ? "exact" : "estimated"}. ` +
  `proof gate ${T.proofGate.state}` +
  (T.proofGate.requires ? ` (${T.proofGate.requires})` : "") + ".";
$("fill").style.width = Math.min(100, 100 * T.used / T.budget) + "%";
$("tok").value = DATA.tokenizer;
$("note").textContent =
  "Nothing on this page changes an admission, a budget, or a declaration. " +
  "The exact count is a recommendation for what to declare next.";

const SIGNALS = {
  utility: ["essential", "useful", "wasted"],
  group: ["Design-Inference", "Repo-Dev", "mixed"],
  contamination: ["none", "possible", "derail"],
};

const rows = $("rows");
for (const c of T.chunks) {
  const tr = document.createElement("tr");
  if (!c.admitted) tr.className = "omitted";
  tr.innerHTML =
    `<td class="key">${c.key}</td>` +
    `<td><span class="tag" style="background:var(--${c.priority})">${c.priority}</span></td>` +
    `<td>${c.role}</td><td>${c.tier}</td><td>${c.channel}</td>` +
    `<td class="num">${c.tokens}</td>` +
    `<td class="num" data-exact="${c.key}"></td>` +
    `<td>${c.reason}</td>` +
    `<td class="review" data-review="${c.key}"></td>`;
  controls(tr.querySelector(".review"), c.key);
  const detail = document.createElement("tr");
  detail.hidden = true;
  detail.innerHTML = `<td colspan="9" class="tokens" data-toks="${c.key}"></td>`;
  tr.querySelector(".key").onclick = () => {
    detail.hidden = !detail.hidden;
    tr.classList.toggle("open", !detail.hidden);
    if (!detail.hidden) paint(c.key, c.priority);
  };
  rows.append(tr, detail);
}

// Three controls, never one. A chunk can be expensive and essential, or cheap
// and a derail, and a single score would make those two indistinguishable.
function controls(cell, key) {
  for (const [signal, values] of Object.entries(SIGNALS)) {
    const select = document.createElement("select");
    select.dataset.key = key;
    select.dataset.signal = signal;
    select.title = signal;
    select.append(new Option(signal, ""));
    for (const value of values) select.append(new Option(value, value));
    select.onchange = () => send(select);
    cell.append(select);
  }
}

async function send(select) {
  const tag = {
    key: select.dataset.key, signal: select.dataset.signal,
    value: select.value, at: new Date().toISOString(),
    pass: T.pass, tokenizer: $("tok").value.trim(),
  };
  const ids = IDS.get(tag.key);
  if (ids) tag.exactTokens = ids.length;
  if (!tag.value) return;
  try {
    const response = await fetch("/tag", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(tag),
    });
    if (!response.ok) throw new Error((await response.json()).error ?? response.status);
    select.classList.add("set");
  } catch (error) {
    select.value = "";
    select.classList.remove("set");
    offline(`That click went nowhere (${error.message}). Serve this page with ` +
            `--serve; a saved copy has no session to append to.`);
  }
}

function offline(message) {
  const banner = $("offline");
  banner.textContent = message;
  banner.style.display = "block";
}

async function rehydrate() {
  let state;
  try {
    state = await (await fetch("/tags")).json();
  } catch {
    document.querySelectorAll("select[data-signal]").forEach((s) => { s.disabled = true; });
    offline("Read-only copy. The trace below is complete and exact counting " +
            "still works; reviewing needs --serve.");
    return;
  }
  for (const [key, tags] of Object.entries(state)) {
    for (const [signal, value] of Object.entries(tags)) {
      const select = document.querySelector(
        `select[data-key="${CSS.escape(key)}"][data-signal="${signal}"]`);
      if (select) { select.value = value; select.classList.add("set"); }
    }
  }
}

let TOKENIZER = null;
const IDS = new Map();

async function count() {
  const name = $("tok").value.trim();
  $("go").disabled = true;
  $("status").textContent = `loading ${name}`;
  try {
    const { AutoTokenizer } = await import(DATA.cdn);
    TOKENIZER = await AutoTokenizer.from_pretrained(name);
  } catch (error) {
    $("status").textContent =
      `${name} did not load (${error.message}). The estimated counts above ` +
      `are unaffected and still deterministic.`;
    $("go").disabled = false;
    return;
  }
  let total = 0;
  for (const c of T.chunks) {
    const ids = TOKENIZER.encode(DATA.texts[c.key] ?? "", { add_special_tokens: false });
    IDS.set(c.key, ids);
    if (c.admitted) total += ids.length;
    const cell = document.querySelector(`[data-exact="${CSS.escape(c.key)}"]`);
    const drift = ids.length - c.tokens;
    cell.innerHTML = `${ids.length} <span class="delta">${drift >= 0 ? "+" : ""}${drift}</span>`;
  }
  $("status").textContent =
    `${name}: ${total} tokens admitted against a ${T.used} estimate ` +
    `(${(total / T.used).toFixed(2)}x). The ${T.budget} budget is declared in ` +
    `estimated tokens; this is what a real one would cost.`;
  $("go").disabled = false;
  document.querySelectorAll("[data-toks]").forEach((cell) => {
    if (cell.parentElement.hidden === false) cell.dataset.painted = "";
  });
}

function paint(key, priority) {
  const cell = document.querySelector(`[data-toks="${CSS.escape(key)}"]`);
  if (cell.dataset.painted === "yes") return;
  const ids = IDS.get(key);
  if (!ids) {
    cell.textContent = "Press Count to tag this chunk's tokens.";
    return;
  }
  cell.textContent = "";
  const color = `var(--${priority})`;
  for (const id of ids) {
    const code = document.createElement("code");
    code.style.color = color;
    code.textContent = TOKENIZER.decode([id]).replace(/\n/g, "\\n") || "·";
    code.title = `${priority} · id ${id}`;
    cell.append(code);
  }
  cell.dataset.painted = "yes";
}

$("go").onclick = count;
rehydrate();
</script>
